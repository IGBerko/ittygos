# ittyGOS tuning for games
# many modern games (and Proton) map a huge number of memory areas; the Debian default is too small
vm.max_map_count = 2147483642
# swap lives in compressed RAM (zram): using it eagerly is cheap
vm.swappiness = 100
vm.page-cluster = 0
# a split-lock slowdown hurts some games
kernel.split_lock_mitigate = 0
# a good default for the network
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
